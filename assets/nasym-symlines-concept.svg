<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Concept diagram: the nose's own intrinsic midline compared against the face's eccentric midline on the same scan">
  <rect x="0" y="0" width="1600" height="1000" fill="#f7f8fa"/>

  <!-- face outline (symmetric) -->
  <path d="M800 120
           C 990 120 1080 260 1080 460
           C 1080 640 1010 790 930 860
           C 890 895 845 912 800 912
           C 755 912 710 895 670 860
           C 590 790 520 640 520 460
           C 520 260 610 120 800 120 Z"
        fill="#eceef2" stroke="#4f5361" stroke-width="4" stroke-linejoin="round"/>

  <!-- ears -->
  <path d="M520 420 C 486 412 468 440 470 470 C 472 500 494 520 522 512" fill="none" stroke="#4f5361" stroke-width="4" stroke-linecap="round"/>
  <path d="M1080 420 C 1114 412 1132 440 1130 470 C 1128 500 1106 520 1078 512" fill="none" stroke="#4f5361" stroke-width="4" stroke-linecap="round"/>

  <!-- eyebrows -->
  <path d="M666 358 C 700 336 742 334 772 352" fill="none" stroke="#4f5361" stroke-width="6" stroke-linecap="round"/>
  <path d="M828 352 C 858 334 900 336 934 358" fill="none" stroke="#4f5361" stroke-width="6" stroke-linecap="round"/>

  <!-- eyes -->
  <path d="M668 392 C 694 374 742 374 768 392 C 742 410 694 410 668 392 Z" fill="none" stroke="#4f5361" stroke-width="4" stroke-linejoin="round"/>
  <path d="M832 392 C 858 374 906 374 932 392 C 906 410 858 410 832 392 Z" fill="none" stroke="#4f5361" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="718" cy="392" r="7" fill="#4f5361"/>
  <circle cx="882" cy="392" r="7" fill="#4f5361"/>

  <!-- nose: intentionally a touch off-axis from the face's true center -->
  <path d="M796 378
           C 792 440 780 500 758 556
           C 746 586 750 610 774 622
           C 800 634 828 628 842 606
           C 856 584 848 560 832 552
           C 816 500 812 440 808 378"
        fill="none" stroke="#4f5361" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- mouth -->
  <path d="M712 748 C 754 774 846 774 888 748" fill="none" stroke="#4f5361" stroke-width="5" stroke-linecap="round"/>

  <!-- eccentric line: the face's own true vertical midline -->
  <line x1="800" y1="150" x2="800" y2="888" stroke="#7a2710" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round"/>
  <circle cx="800" cy="150" r="9" fill="#7a2710"/>
  <circle cx="800" cy="888" r="9" fill="#7a2710"/>

  <!-- intrinsic line: the nose's own midline, read from its own tip and root -->
  <path d="M797 378 C 793 460 785 540 774 622" fill="none" stroke="#b03716" stroke-width="7" stroke-linecap="round"/>
  <circle cx="797" cy="378" r="9" fill="#b03716"/>
  <circle cx="774" cy="622" r="9" fill="#b03716"/>

  <!-- legend -->
  <g font-family="Archivo, Helvetica, Arial, sans-serif">
    <line x1="520" y1="944" x2="562" y2="944" stroke="#b03716" stroke-width="7" stroke-linecap="round"/>
    <text x="576" y="953" font-size="26" font-weight="600" fill="#26282e">Intrinsic — the nose's own midline</text>
    <line x1="520" y1="984" x2="562" y2="984" stroke="#7a2710" stroke-width="5" stroke-dasharray="4 12" stroke-linecap="round"/>
    <text x="576" y="993" font-size="26" font-weight="600" fill="#26282e">Eccentric — the face's true midline</text>
  </g>
</svg>
