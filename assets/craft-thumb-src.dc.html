<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html, body { margin: 0; padding: 0; background: transparent; }
</style>
</helmet>
<div style="width: 1440px; padding: 130px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; background: transparent;">
  <div style="width: 1180px; box-sizing: border-box; background: linear-gradient(180deg, #26272d 0%, #1d1e23 100%); border-radius: 26px; padding: 20px; box-shadow: 0 30px 60px -30px rgba(20,22,28,0.45);">
    <div style="width: 1140px; border-radius: 12px; overflow: hidden; background: #f9f9fc; display: flex; flex-direction: column;">
      <div style="height: 36px; flex: none; background: #eceef1; border-bottom: 1px solid #dcdee3; display: flex; align-items: center; gap: 8px; padding: 0 14px;">
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57;"></span>
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e;"></span>
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #28c840;"></span>
      </div>
      <img src="./crafting-sandbox.svg" alt="The Crafting Sandbox single-workspace interface" style="display: block; width: 100%; height: auto; flex: none; aspect-ratio: 1038 / 721;">
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1480,&quot;height&quot;:1060}}"></script>
</body>
</html>
